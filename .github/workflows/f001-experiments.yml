name: F-001 research experiments

on:
  push:
    paths:
      - "experiments/f001/**"
      - ".github/workflows/f001-experiments.yml"
  pull_request:
    paths:
      - "experiments/f001/**"
      - ".github/workflows/f001-experiments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run all F-001 experiment scripts
        run: python experiments/f001/run_all.py
